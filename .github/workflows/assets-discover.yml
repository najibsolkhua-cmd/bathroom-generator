# Вспомогательное: скачивает миниатюры фото-кандидатов из assets/candidates.json
# в ветку assets-candidates (для отбора, в main не попадает).
name: Миниатюры фото-кандидатов

on:
  push:
    paths: ['assets/candidates.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Скачиваем миниатюры
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          items = json.load(open('assets/candidates.json'))
          os.makedirs('cand', exist_ok=True)
          log = []
          hdr = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128 Safari/537.36'}
          for it in items:
            url = f"https://images.unsplash.com/{it['id']}?w=360&q=70&fm=jpg&fit=max"
            try:
              data = urllib.request.urlopen(urllib.request.Request(url, headers=hdr), timeout=30).read()
              open(f"cand/{it['id']}.jpg", 'wb').write(data)
              log.append(f"OK {it['id']} {len(data)}")
            except Exception as e:
              log.append(f"FAIL {it['id']} {e}")
          open('cand/log.txt', 'w').write('\n'.join(log))
          PY
      - name: Публикуем в ветку assets-candidates
        run: |
          cd cand
          git init -q -b assets-candidates
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Кандидаты фото"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" assets-candidates
