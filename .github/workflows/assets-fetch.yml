# Скачивает выбранные фото (assets/photos.json) и шрифты в public/ и сохраняет их в эту же ветку.
# Добавить фото: впишите его в assets/photos.json и отправьте изменение — остальное сделается само.
name: Загрузка фото и шрифтов

on:
  push:
    paths: ['assets/photos.json', 'assets/fonts.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Фото с Unsplash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          photos = json.load(open('assets/photos.json'))
          os.makedirs('public/img/photos', exist_ok=True)
          hdr = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128 Safari/537.36'}
          for p in photos:
            for suffix, width, q in (('', 1600, 78), ('-sm', 640, 72)):
              path = f"public/img/photos/{p['name']}{suffix}.jpg"
              if os.path.exists(path): continue
              url = f"https://images.unsplash.com/{p['id']}?w={width}&q={q}&fm=jpg&fit=max"
              data = urllib.request.urlopen(urllib.request.Request(url, headers=hdr), timeout=60).read()
              open(path, 'wb').write(data)
              print('OK', path, len(data))
          PY
      - name: Шрифты (Onest, Unbounded — лицензия OFL)
        run: |
          mkdir -p public/fonts tmpfonts && cd tmpfonts
          for pkg in $(python3 -c "import json;print(' '.join(json.load(open('../assets/fonts.json'))['packages']))"); do
            npm pack "$pkg" --silent >/dev/null && tar xzf *.tgz && rm *.tgz
            name=$(python3 -c "import json;print(json.load(open('package/package.json'))['name'].split('/')[-1])")
            for w in $(python3 -c "import json;print(' '.join(map(str, json.load(open('../assets/fonts.json'))['weights']['$name'])))"); do
              for s in cyrillic latin; do cp "package/files/$name-$s-$w-normal.woff2" ../public/fonts/ ; done
            done
            cp package/LICENSE ../public/fonts/LICENSE-$name.txt 2>/dev/null || true
            rm -rf package
          done
          cd .. && rm -rf tmpfonts && ls public/fonts
      - name: Сохраняем в ветку
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add public/img/photos public/fonts
          git diff --cached --quiet || git commit -q -m "Фото и шрифты загружены автоматически"
          git push
