<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Просмотр на компьютере и телефоне</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background: #DDE3E0; }
    .pv { padding: 24px 0 40px; }
    .pv h1 { font-family: var(--font-display); font-weight: 600; font-size: clamp(22px, 3vw, 30px); letter-spacing: -0.02em; margin: 0 0 6px; }
    .pv p { margin: 0 0 20px; color: var(--mist); }
    .pv__row { display: flex; gap: 28px; align-items: flex-start; justify-content: center; flex-wrap: wrap; }
    .device { background: #111; box-shadow: 0 30px 60px -30px rgba(0,0,0,.5); }
    .device--desktop { width: min(100%, 980px); border-radius: 14px; padding: 28px 10px 10px; position: relative; }
    .device--desktop::before { content: ''; position: absolute; top: 11px; left: 14px; width: 42px; height: 8px; background: radial-gradient(circle, #555 3px, transparent 4px) 0 0 / 14px 8px repeat-x; }
    .device--desktop .screen { aspect-ratio: 16 / 10; }
    .device--phone { width: 330px; border-radius: 44px; padding: 14px; }
    .device--phone .screen { aspect-ratio: 390 / 844; border-radius: 32px; }
    .screen { position: relative; overflow: hidden; background: #fff; border-radius: 6px; }
    .screen iframe { position: absolute; top: 0; left: 0; border: 0; transform-origin: 0 0; }
    .label { text-align: center; margin-top: 10px; font-weight: 600; color: var(--ink); }
  </style>
</head>
<body>
  <main class="wrap pv">
    <h1>Сайт на компьютере и телефоне</h1>
    <p>Обе версии живые: можно листать, выбирать параметры и запускать генерацию. <a href="./">Открыть сайт целиком</a></p>
    <div class="pv__row">
      <div><div class="device device--desktop"><div class="screen" data-w="1440"><iframe src="./" title="Компьютерная версия" width="1440" height="900"></iframe></div></div><div class="label">Компьютер</div></div>
      <div><div class="device device--phone"><div class="screen" data-w="390"><iframe src="./" title="Телефонная версия" width="390" height="844"></iframe></div></div><div class="label">Телефон</div></div>
    </div>
  </main>
  <script>
    function fit() {
      document.querySelectorAll('.screen').forEach(function (s) {
        var f = s.querySelector('iframe');
        var k = s.clientWidth / Number(s.dataset.w);
        f.style.transform = 'scale(' + k + ')';
        f.height = Math.round(s.clientHeight / k);
      });
    }
    window.addEventListener('resize', fit);
    fit();
  </script>
</body>
</html>
